# Sovereign Engine — public CI gate.
#
# These jobs build and vet the engine, check formatting, and test hot-path
# allocations and data-structure layout on GitHub-hosted ARM64 runners.
# Throughput-regression benchmarks need pinned CPUs on dedicated Graviton
# machines and are outside this hosted workflow.

name: gatekeeper

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so stale revisions do not waste CI time.
concurrency:
  group: gatekeeper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (CGO + jemalloc), gofmt, vet
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: true
      # The engine binds jemalloc via CGO for the off-heap store; install the dev headers.
      - name: install jemalloc (CGO substrate)
        run: |
          sudo apt-get update
          sudo apt-get install -y libjemalloc-dev
      - name: go build ./...
        run: go build ./...
      - name: gofmt must be clean
        run: test -z "$(gofmt -l .)"
      - name: go vet (only the sanctioned unsafe.Pointer arena notes allowed)
        run: |
          out=$(go vet ./... 2>&1 || true)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -vE 'possible misuse of unsafe.Pointer|^#' | grep -qE '\.go:[0-9]'; then
            echo "::error::go vet reported findings beyond the sanctioned unsafe.Pointer arena notes"
            exit 1
          fi

  gates:
    name: zero-GC + struct-layout
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: true
      - name: install jemalloc (CGO substrate)
        run: |
          sudo apt-get update
          sudo apt-get install -y libjemalloc-dev
      # Assert that the measured HAMT.Set hot path performs no heap allocations.
      - name: zero-GC hot path (0 allocs/op, 0 B/op)
        run: go test ./pkg/sync/ -run 'TestHotPathZeroAllocations' -count=1
      # Check CRDT and HAMT sizes and field offsets used by the arena representation.
      - name: struct layout (zero wasted padding)
        run: go test ./pkg/sync/ -run 'TestCRDTEntry_SizeAndAlignment|TestHamtLeaf_SizeAndAlignment|TestHamtNodeOffsets' -count=1
