<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" width="780" height="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#7c8cf8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="600" rx="16" fill="#0d1117"/>
  <text x="390" y="40" text-anchor="middle" font-size="15" fill="#8b949e" letter-spacing="0.5">write path &amp; convergence</text>

  <!-- 1. clients -->
  <rect x="110" y="64" width="560" height="54" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="390" y="97" text-anchor="middle" font-size="17" fill="#e6edf3">Clients · Go SDK</text>

  <line x1="390" y1="118" x2="390" y2="146" stroke="#7c8cf8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="402" y="138" font-size="12.5" fill="#7c8cf8">mTLS 1.3 · post-quantum (X25519MLKEM768)</text>

  <!-- 2. ingest -->
  <rect x="110" y="150" width="560" height="54" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="390" y="183" text-anchor="middle" font-size="17" fill="#e6edf3">Ingest — batched Ed25519 verify</text>

  <line x1="390" y1="204" x2="390" y2="232" stroke="#7c8cf8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3. core (emphasized) -->
  <rect x="110" y="236" width="560" height="86" rx="12" fill="#101a2b" stroke="url(#bg)" stroke-width="2.5"/>
  <text x="390" y="272" text-anchor="middle" font-size="20" font-weight="bold" fill="#e6edf3">δ-CRDT core</text>
  <text x="390" y="300" text-anchor="middle" font-size="14.5" fill="#9fb0ff">tri-temporal · off-heap HAMT · zero-GC · 0 allocs/op</text>

  <!-- split to durability + storage -->
  <line x1="330" y1="322" x2="248" y2="352" stroke="#7c8cf8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="450" y1="322" x2="532" y2="352" stroke="#7c8cf8" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="110" y="356" width="268" height="66" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="244" y="382" text-anchor="middle" font-size="15.5" fill="#e6edf3">Durability</text>
  <text x="244" y="405" text-anchor="middle" font-size="13" fill="#8b949e">WAL + snapshot</text>

  <rect x="402" y="356" width="268" height="66" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="536" y="382" text-anchor="middle" font-size="15.5" fill="#e6edf3">Storage</text>
  <text x="536" y="405" text-anchor="middle" font-size="13" fill="#8b949e">LSM · L0 → L1</text>

  <!-- mesh -->
  <rect x="110" y="452" width="560" height="78" rx="12" fill="#101a2b" stroke="url(#bg)" stroke-width="2"/>
  <text x="390" y="484" text-anchor="middle" font-size="16.5" fill="#e6edf3">Mesh gossip — anti-entropy</text>
  <text x="390" y="508" text-anchor="middle" font-size="13.5" fill="#9fb0ff">100 nodes · 3 regions · converge to one Merkle root</text>
  <!-- peer arrows -->
  <line x1="70" y1="478" x2="104" y2="478" stroke="#7c8cf8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="104" y1="504" x2="70" y2="504" stroke="#7c8cf8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="52" y="496" text-anchor="middle" font-size="13" fill="#8b949e">peer</text>
  <line x1="676" y1="478" x2="710" y2="478" stroke="#7c8cf8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="710" y1="504" x2="676" y2="504" stroke="#7c8cf8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="728" y="496" text-anchor="middle" font-size="13" fill="#8b949e">peer</text>
</svg>
